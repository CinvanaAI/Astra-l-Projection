name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-code:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Client and conversation bridge
        run: python -B -m unittest discover -s tests -v
      - name: Optional provider contract (no model calls)
        run: python -B -m unittest discover -s adapters/tests -v
      - name: Installer behavior
        run: python -B tools/test_tools.py
      - name: Repository and native-source consistency
        run: python -B tools/check_repository.py

# Unreal compilation and rendered runtime checks require a separately installed
# engine and are documented in docs/VALIDATION.md; this job does not claim them.
